server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/html text/css application/javascript image/svg+xml application/xml;
  location = /healthz { access_log off; return 200 "ok\n"; }
  location = / { add_header Cache-Control "public, max-age=300"; try_files /index.html =404; }
  location / { add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
}
